<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ritam Misra</title>
  <meta name="description" content="Ritam Misra's corner of the internet. Press the button if you dare.">

  <!-- Fonts: a Japanese-style serif for headings, a clean sans for text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== THE PAGE BEFORE THE EXPANSION ===== -->
  <main class="hero">
    <p class="label">ritammisra.com</p>
    <h1>Ritam<br>Misra</h1>
    <p class="lede">A quiet corner of the internet. It's probably safe to stay out here.</p>

    <div class="row">
      <button id="expand" class="expand">
        <span>Domain Expansion</span>
        <small>領域展開</small>
      </button>
      <button id="sound" class="ghost" aria-pressed="false">Sound: off</button>
    </div>
  </main>

  <!-- ===== THE FLASH THAT PLAYS WHEN YOU PRESS THE BUTTON ===== -->
  <div class="flash" aria-hidden="true">領域展開</div>

  <!-- ===== THE INSIDE OF THE DOMAIN (hidden until expanded) ===== -->
  <section class="barrier" id="barrier" aria-label="Inside the domain" inert>
    <div class="stars"></div>
    <div class="rings"></div>

    <div class="inside">
      <p class="label">Inside the domain</p>
      <h2>You're in.</h2>
      <p>Sure-hit guarantee: you will click the link below.</p>

      <ul class="links">
        <li><a href="mailto:hello@ritammisra.com">Email <small>hello@ritammisra.com</small></a></li>
      </ul>

      <button id="release" class="ghost">Release domain</button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
