<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .coin { transform-box: fill-box; transform-origin: center; animation: flip 3.5s ease-in-out infinite; }
    @keyframes flip {
      0%, 60%  { transform: scaleX(1); }
      80%      { transform: scaleX(0.06); }
      100%     { transform: scaleX(1); }
    }
    @media (prefers-reduced-motion: reduce) { .coin { animation: none; } }
  </style>

  <g class="coin">
    <circle cx="32" cy="32" r="29" fill="#ffd84d" stroke="#1d1230" stroke-width="4"/>
    <circle cx="32" cy="32" r="22" fill="none" stroke="#1d1230" stroke-width="2" stroke-dasharray="3 3"/>
    <path transform="translate(32 32) rotate(-5) scale(.62) translate(-34.5 -32)"
          fill="#1d1230" fill-rule="evenodd"
          d="M16 12H38C48 12 52 18 52 25C52 31 48 35 42 36L53 52H40L31 37H28V52H16Z
             M28 22V30H37C40 30 41 28 41 26C41 24 40 22 37 22Z"/>
  </g>
</svg>